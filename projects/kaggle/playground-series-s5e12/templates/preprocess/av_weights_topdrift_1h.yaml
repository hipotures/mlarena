module: av_weights
cache: true
config:
  presets: best
  time_limit: 3600
  drop_columns:
  - id
  - age
  - alcohol_consumption_per_week
  - diet_score
  - sleep_hours_per_day
  - screen_time_hours_per_day
  - bmi
  - waist_to_hip_ratio
  - systolic_bp
  - diastolic_bp
  - heart_rate
  - hdl_cholesterol
  - gender
  - ethnicity
  - education_level
  - income_level
  - smoking_status
  - employment_status
  - family_history_diabetes
  - hypertension_history
  - cardiovascular_history
  output_path: train_av_weights_topdrift.csv
  model_output_dir: av_model_topdrift
