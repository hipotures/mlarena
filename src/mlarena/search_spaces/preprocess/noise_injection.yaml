group: noise_injection
template: noise_injection

base_config:
  include_cols: null
  exclude_cols: []
  use_original_features_only: true
  noise_type: gaussian
  augment_ratio: 0.3
  gaussian_sigma: 0.01
  gaussian_scale_by_std: true
  swap_prob: 0.1
  random_state: 42

variants:
  - name: gaussian_small
    params:
      noise_type: {type: choice, values: [gaussian]}
      gaussian_sigma: {type: float_range, min: 0.005, max: 0.02, log: true}
      augment_ratio: {type: float_range, min: 0.1, max: 0.4, step: 0.1}
  - name: gaussian_medium
    params:
      noise_type: {type: choice, values: [gaussian]}
      gaussian_sigma: {type: float_range, min: 0.02, max: 0.05, step: 0.01}
      augment_ratio: {type: float_range, min: 0.2, max: 0.6, step: 0.1}
  - name: swap
    params:
      noise_type: {type: choice, values: [swap]}
      swap_prob: {type: float_range, min: 0.05, max: 0.2, step: 0.05}
      augment_ratio: {type: float_range, min: 0.1, max: 0.4, step: 0.1}
