# AutoGluon HPO Preset: Medium
# Target: Quick HPO for iteration/debugging (1-2 hours total)
# Usage: hpo_preset: hpo_boost_medium

hpo:
  num_trials: 20
  scheduler: local
  searcher: auto

search_space:
  GBM:
    learning_rate: [0.01, 0.3, log]
    num_leaves: [20, 150]
    min_data_in_leaf: [10, 50]
    feature_fraction: [0.6, 1.0]
    bagging_fraction: [0.6, 1.0]
    bagging_freq: [1, 7]
    lambda_l1: [1e-5, 10.0, log]
    lambda_l2: [1e-5, 10.0, log]

  XGB:
    learning_rate: [0.01, 0.3, log]
    max_depth: [3, 8]
    min_child_weight: [1, 7]
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
    gamma: [0.0, 2.0]
    reg_alpha: [1e-5, 10.0, log]
    reg_lambda: [1e-5, 10.0, log]

  CAT:
    learning_rate: [0.01, 0.3, log]
    depth: [4, 8]
    l2_leaf_reg: [1.0, 7.0]
    border_count: [32, 128]
    bagging_temperature: [0.0, 0.8]
