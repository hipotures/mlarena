group: scaler
template: scaler

base_config:
  numeric_include: null
  numeric_exclude: []
  log_transform: []
  random_state: 42
  power_standardize: true

variants:
  - name: standard
    weight: 2.0
    params:
      scaling_method: {type: choice, values: [standard]}
  - name: minmax
    params:
      scaling_method: {type: choice, values: [minmax]}
  - name: robust
    weight: 2.0
    params:
      scaling_method: {type: choice, values: [robust]}
  - name: quantile_normal
    params:
      scaling_method: {type: choice, values: [quantile_normal]}
      n_quantiles: {type: int_range, min: 200, max: 2000, step: 100}
  - name: quantile_uniform
    params:
      scaling_method: {type: choice, values: [quantile_uniform]}
      n_quantiles: {type: int_range, min: 200, max: 2000, step: 100}
#  - name: power_boxcox
#    params:
#      scaling_method: {type: choice, values: [power_boxcox]}
#      power_standardize: {type: bool}
  - name: power_yeo_johnson
    params:
      scaling_method: {type: choice, values: [power_yeo_johnson]}
      power_standardize: {type: bool}
requires_preproc: [{group: imputer}]
