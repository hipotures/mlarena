[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaggle-projects"
version = "0.2.0"
description = "Kaggle competition projects with shared tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=1.7.4.5",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "autogluon>=1.0.0",
    "playwright>=1.48.0",
    "ydata-profiling>=4.6.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "tabicl>=0.1.0",
    "skrub>=0.4.0",
    # Optuna hyperparameter tuning system
    "optuna>=3.0.0",
    "optuna-dashboard>=0.15.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "pyarrow>=14.0.0",
    "polars>=1.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_tools"]
