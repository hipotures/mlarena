# Test template: HPO Medium preset for Titanic
# Usage: uv run python scripts/mla.py model --project Titanic --model-template test_hpo_medium --smoke

model: autogluon_baseline
hpo_preset: hpo_boost_medium
config:
  preset: best
  time_limit: 3600
  use_gpu: false
  included_model_types: [GBM, XGB, CAT]

  # Optional: Override preset defaults
  # num_trials: 75  # Override medium default (50)
  # searcher: bayesian
