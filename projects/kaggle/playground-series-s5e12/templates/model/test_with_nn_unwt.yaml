# T1-B + T6-B2: Boosting + NN + weight_evaluation=False + HPO
# 4 models → 8h, 30 trials (GPU required)

model: autogluon_baseline
hpo_preset: hpo_boost_medium
preprocess_template: top0_te_scale_ext_m
included_model_types: ["GBM", "XGB", "CAT", "NN_TORCH"]
config:
  preset: best
  time_limit: 28800  # 8h
  use_gpu: true  # NN requires GPU for efficiency

  # Sample weights from preprocessing (top0_av_weights via artifacts)
  weight_evaluation: false  # Use weights for TRAINING only, not evaluation

  # HPO settings: 4 models (+ NN) → 30 trials
  num_trials: 30
  searcher: bayes
