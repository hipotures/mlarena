module: adversarial_validation
cache: true
config:
  # AutoGluon AV model training
  presets: medium_quality_faster_train
  time_limit: 120  # 2 minutes for Titanic (small dataset)
  included_model_types: ["XGB"]  # XGB only for faster training

  # Weight transformation
  weight_transform: odds_ratio_normalized

  # Output
  weights_output_name: train_av_weights.csv
  weight_column_name: __sample_weight__
