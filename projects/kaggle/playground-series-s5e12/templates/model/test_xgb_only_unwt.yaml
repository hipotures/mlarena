# T1-B + T6-Fast: XGB only + weight_evaluation=False
# Fast test for unweighted evaluation (~30min instead of 3h)

preprocess_template: top0_te_scale_ext_m
included_model_types: ["XGB"]
config:
  preset: best
  time_limit: 1800  # 30min (faster iteration)
  use_gpu: false

  # Sample weights from preprocessing (top0_av_weights via artifacts)
  weight_evaluation: false  # Use weights for TRAINING only, not evaluation
