group: drift
template: drift_detector

base_config:
  max_drop_fraction: 0.2
  random_state: 42

variants:
  - name: psi_drop
    params:
      drift_metric: {type: choice, values: [psi]}
      max_psi: {type: float_range, min: 0.1, max: 0.4, step: 0.05, round: 2}
      action: {type: fixed, value: drop}
      max_drop_fraction: {type: float_range, min: 0.1, max: 0.5, step: 0.1, round: 2}
  - name: ks
    params:
      drift_metric: {type: choice, values: [ks]}
      max_ks: {type: float_range, min: 0.05, max: 0.2, step: 0.05, round: 2}
      max_pvalue: {type: float_range, min: 0.001, max: 0.05, step: 0.01, round: 3}
      action: {type: fixed, value: drop}
  - name: model_auc
    params:
      drift_metric: {type: choice, values: [model_auc]}
      min_auc: {type: float_range, min: 0.55, max: 0.75, step: 0.05, round: 2}
      action: {type: fixed, value: drop}
      max_drop_fraction: {type: float_range, min: 0.1, max: 0.5, step: 0.1, round: 2}
