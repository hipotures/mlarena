templates:
  # Chain: categorical detection + AV weights (best boost)
  categorical_av_best_boost:
    chain: [categorical_boost, av_weights_best_boost]

  # Chain: categorical detection + AV weights (medium 2min)
  categorical_av:
    chain: [categorical_boost, av_weights]

  av_weights:
    module: av_weights
    cache: true
    config:
      presets: medium
      time_limit: 120
      drop_columns: [id]
      # Paths relative to experiment artifacts dir (experiments/pre-av_weights/artifacts/)
      output_path: train_av_weights.csv
      model_output_dir: av_model

  av_weights_best_boost:
    module: av_weights
    cache: true
    config:
      presets: best
      time_limit: 21600
      drop_columns: [id]
      included_model_types: ["CAT", "GBM", "XGB"]
      output_path: train_av_weights.csv
      model_output_dir: av_model

  av_weights_topdrift_1h:
    module: av_weights
    cache: true
    config:
      presets: best
      time_limit: 3600
      # keep only selected high-drift cols; drop everything else
      drop_columns:
        - id
        - age
        - alcohol_consumption_per_week
        - diet_score
        - sleep_hours_per_day
        - screen_time_hours_per_day
        - bmi
        - waist_to_hip_ratio
        - systolic_bp
        - diastolic_bp
        - heart_rate
        - hdl_cholesterol
        - gender
        - ethnicity
        - education_level
        - income_level
        - smoking_status
        - employment_status
        - family_history_diabetes
        - hypertension_history
        - cardiovascular_history
      # AV will train on: physical_activity_minutes_per_week, cholesterol_total, ldl_cholesterol, triglycerides
      output_path: train_av_weights_topdrift.csv
      model_output_dir: av_model_topdrift

  av_weights_mix:
    module: av_weights_mix
    cache: true
    config:
      orig_path: data/diabetes_dataset.csv  # Relative to project root
      mode: align  # Keep only competition columns
      source_flag: null  # No source flag
      time_limit: 300
      presets: medium_quality_faster_train
      included_model_types: null
      drop_columns: []
      output_filename: train_av_weights.csv
      model_dir: av_model_mix
      keep_extra_weights: false

  av_weights_mix_best:
    module: av_weights_mix
    cache: true
    config:
      orig_path: data/diabetes_dataset.csv
      mode: align
      source_flag: null
      time_limit: 28800  # 8h
      presets: best_quality
      included_model_types: ["GBM", "CAT", "XGB"]
      drop_columns: []
      output_filename: train_av_weights.csv
      model_dir: av_model_mix_best
      keep_extra_weights: false

  av_weights_mix_union:
    module: av_weights_mix
    cache: true
    config:
      orig_path: data/diabetes_dataset.csv
      mode: union  # Merge all columns
      source_flag: is_original  # Add source flag column
      time_limit: 600
      presets: medium_quality_faster_train
      included_model_types: null
      drop_columns: []
      output_filename: train_av_weights.csv
      model_dir: av_model_mix_union
      keep_extra_weights: false

  # ============================================
  # New standard pipelines (EDA-informed)
  # ============================================

  # Sanity check tuned for S5E12 (keep all cols, no drops)
  sanity_check_ps5e12:
    module: sanity_check
    cache: true
    config:
      min_unique_fraction: 0.0
      max_missing_fraction: 1.0
      drop_duplicates: false
      column_types_override: {}
      ignore_columns: []

  # Feature selection via mutual information, moderate drift drop, CatBoost encoding to avoid one-hot explosion
  ps5e12_drift_mi:
    chain:
      - sanity_check_ps5e12
      - imputer
      - rare_category_handler
      - encoder_catboost
      #- drift_detector_moderate
      - feature_selector_mi
      - imbalance_handler

  # Feature selection via model importance (RF), drift drop, CatBoost encoding
  ps5e12_drift_modelimp:
    chain:
      - sanity_check_ps5e12
      - imputer
      - rare_category_handler
      - encoder_catboost
      #- drift_detector_moderate
      - feature_selector_modelimp
      - imbalance_handler

  # ---- Component templates ----
  encoder_catboost:
    module: encoder
    cache: true
    config:
      encoding_method: "catboost"
      max_cardinality: 1000
      handle_unknown: "ignore"
      drop_first: false

  drift_detector_moderate:
    module: drift_detector
    cache: true
    config:
      drift_metric: "psi"
      max_psi: 0.2
      action: "drop"
      max_drop_fraction: 0.2

  feature_selector_mi:
    module: feature_selector
    cache: true
    config:
      selection_method: "mi"
      keep_fraction: 0.9
      max_drop_fraction: 0.4

  feature_selector_modelimp:
    module: feature_selector
    cache: true
    config:
      selection_method: "model_importance"
      importance_model_type: "rf"
      keep_fraction: 0.9
      min_importance: 0.1
      max_drop_fraction: 0.4
      n_estimators: 200
      max_depth: 10

  outlier_handler_light:
    module: outlier_handler
    cache: true
    config:
      outlier_method: "iqr"
      iqr_factor: 2.0
      action: "clip"
      lower_quantile: 0.001
      upper_quantile: 0.999
