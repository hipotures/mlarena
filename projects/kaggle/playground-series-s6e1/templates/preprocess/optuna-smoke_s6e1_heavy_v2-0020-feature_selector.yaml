module: feature_selector
config:
  n_features: 0.7
  min_variance: 0.01
  min_unique_per_million: 5.0
  min_importance: 0.001
  importance_model_type: lgbm
  n_estimators: 100
  max_depth: 5
  random_state: 42
  max_drop_fraction: 0.5
  protect_cb_features: true
  selection_method: model_importance
