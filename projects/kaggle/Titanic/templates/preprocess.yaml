templates:
  # Adjusted sanity_check for small Titanic dataset
  sanity_check_titanic:
    module: sanity_check
    cache: true
    config:
      min_unique_fraction: 0.0001  # Lower threshold for small dataset (891 rows)
      max_missing_fraction: 0.95
      drop_duplicates: true
      ignore_columns: []

  # Test chain: sanity_check + noop
  sanity_noop_chain:
    chain: [sanity_check_titanic, noop]

  # Rare category handler tuned for Titanic (process Name instead of skipping as ID-like)
  rare_titanic:
    module: rare_category_handler
    cache: true
    config:
      min_freq: 5
      min_freq_ratio: 0.0
      top_k: 30
      rare_label: "__RARE__"
      detect_id_like_columns: false  # process Name instead of skipping
      id_unique_fraction_threshold: 1.0

  # Encoder tuned for Titanic (after rare handling)
  encoder_titanic:
    module: encoder
    cache: true
    config:
      encoding_method: "one_hot"
      max_cardinality: 100  # safe after rare handling
      handle_unknown: "ignore"

  # Full pipeline for Titanic
  titanic_standard_pipeline:
    chain:
      - sanity_check_titanic
      - imputer
      - rare_titanic
      - encoder_titanic
      - outlier_handler
      - imbalance_handler
