model: autogluon_baseline
preprocess_template: train_p25
config:
  preset: best
  time_limit: 3600
  use_gpu: false
  included_model_types:
  - GBM
  - CAT
  - XGB
  hpo_preset: hpo_boost_best
  num_trials: 500
  hyperparameters:
    ag_args_fit:
      num_gpus: 0
      num_cpus: 8
    GBM:
      device: cpu
    CAT:
      task_type: CPU
    XGB:
      tree_method: hist
      enable_categorical: true
      n_jobs: 8
