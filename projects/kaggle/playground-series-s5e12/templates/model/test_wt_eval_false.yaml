# T1-B + T6-B1: Boosting (GBM+XGB+CAT) + weight_evaluation=False + HPO
# 3 models → 6h, 50 trials

model: autogluon_baseline
hpo_preset: hpo_boost_medium
preprocess_template: top0_te_scale_ext_m
included_model_types: ["GBM", "XGB", "CAT"]
config:
  preset: best
  time_limit: 21600  # 6h
  use_gpu: false

  # Sample weights from preprocessing (top0_av_weights via artifacts)
  weight_evaluation: false  # Use weights for TRAINING only, not evaluation

  # HPO settings: 3 models → 50 trials
  num_trials: 50
  searcher: bayes
