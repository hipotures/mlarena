group: pseudo_labeling
template: pseudo_labeling

base_config:
  include_cols: null
  exclude_cols: []
  use_original_features_only: true
  model_type: logreg
  logreg_max_iter: 200
  logreg_c: 1.0
  rf_n_estimators: 200
  rf_max_depth: null
  confidence_threshold: 0.9
  max_pseudo_fraction: 0.2
  use_soft_labels: false
  weight_by_confidence: false
  scale_features: true
  missing_strategy: median
  fit_on_val: false
  allow_regression: false
  regression_keep_fraction: 0.2
  random_state: 42

variants:
  - name: logreg_strict
    params:
      model_type: {type: choice, values: [logreg]}
      confidence_threshold: {type: float_range, min: 0.92, max: 0.99, step: 0.01}
      max_pseudo_fraction: {type: float_range, min: 0.05, max: 0.2, step: 0.05}
  - name: logreg_mid
    params:
      model_type: {type: choice, values: [logreg]}
      confidence_threshold: {type: float_range, min: 0.85, max: 0.92, step: 0.01}
      max_pseudo_fraction: {type: float_range, min: 0.1, max: 0.3, step: 0.05}
  - name: rf_mid
    params:
      model_type: {type: choice, values: [rf]}
      rf_n_estimators: {type: int_range, min: 150, max: 400, step: 50}
      confidence_threshold: {type: float_range, min: 0.85, max: 0.95, step: 0.02}
      max_pseudo_fraction: {type: float_range, min: 0.1, max: 0.3, step: 0.05}
