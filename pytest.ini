[pytest]
testpaths = tests
markers =
    e2e: End-to-end integration tests (slow, real data)
    slow: Tests that take >1 minute
    fast: Tests that complete in <10 seconds
    unit: Unit tests (isolated, mocked)
    integration: Integration tests (multi-module)

filterwarnings =
    # ydata-profiling deprecation warnings (fixed in future versions)
    ignore:datetime.datetime.utcnow.*:DeprecationWarning:ydata_profiling
    ignore:'imghdr' is deprecated.*:DeprecationWarning:visions
