project: <slug>
experiment_prefix: optuna_preprocess
filter_by_eda: true

tune:
  allow_heavy_steps: false
  allow_heavy_variants: false
  optuna_workers: 8
  optuna_storage_timeout: 100
  model_cleanup: true
  direction: maximize
  max_trial_sec: 1800
  max_features_out: 5000
  quiet_preprocess_panel: true
  quiet_model_panel: false
  model_verbosity: 2

preprocessors:
  - name: sanity_check
    group: sanity
    template: sanity_check
    enabled: true
    meta: {heavy_step: false, default_enabled_fast: true}

  - name: train_fraction
    group: train_fraction_fixed
    template: train_fraction
    enabled: true
    meta: {heavy_step: false, default_enabled_fast: true, fixed: true}
    fixed_config:
      train_fraction: 0.6
      valid_fraction: 0.1
      eval_fraction: 0.1
      random_state: 42

  - name: target_transformer
    group: target_transformer_fixed
    template: target_transformer
    enabled: false
    meta: {heavy_step: false}
    fixed_config:
      target_transform: none
      clip_lower_quantile: null
      clip_upper_quantile: null
      shift_before_log: true
      shift_value: null
      standardize: true

  - name: datetime_handler
    group: datetime
    template: datetime_handler
    enabled: true
    meta: {heavy_step: false}

  - name: time_series_features
    group: time_series_features
    template: time_series_features
    enabled: false
    meta: {heavy_step: true, default_enabled_fast: false, timeout_sec: 600}

  - name: missingness_features
    group: missingness_features
    template: missingness_features
    enabled: true
    meta: {heavy_step: false}

  - name: outlier_handler
    group: outlier
    template: outlier_handler
    enabled: true
    meta: {heavy_step: false, heavy_variants: ["isolation_forest"]}

  - name: imputer
    group: imputer
    template: imputer
    enabled: true
    meta: {heavy_step: false, heavy_variants: ["knn","iterative"]}

  - name: rare_category_handler
    group: rare_category
    template: rare_category_handler
    enabled: true
    meta: {heavy_step: false}

  - name: feature_group_agg
    group: feature_group_agg
    template: feature_group_agg
    enabled: false
    meta: {heavy_step: false}

  - name: groupwise_normalizer
    group: groupwise_normalizer
    template: groupwise_normalizer
    enabled: false
    meta: {heavy_step: false}

  - name: categorical_cross
    group: categorical_cross
    template: categorical_cross
    enabled: false
    meta: {heavy_step: true, timeout_sec: 300}

  # --- OPTION B: rank pre/post ---
  - name: rank_features_pre
    group: rank_pre
    template: rank_features
    enabled: false
    meta: {heavy_step: false}
    overrides:
      allow_group_mode: true

  - name: numeric_binner
    group: numeric_binner
    template: numeric_binner
    enabled: false
    meta: {heavy_step: false, heavy_variants: ["kmeans"]}

  - name: encoder
    group: encoding
    template: encoder
    enabled: true
    meta: {heavy_step: false, heavy_variants: ["target_mean_oof"]}

  - name: row_aggregates
    group: row_aggregates
    template: row_aggregates
    enabled: false
    meta: {heavy_step: false}

  - name: feature_interactions
    group: feature_interactions
    template: feature_interactions
    enabled: false
    meta: {heavy_step: false}

  - name: feature_polynomial
    group: feature_polynomial
    template: feature_polynomial
    enabled: false
    meta: {heavy_step: true, timeout_sec: 600}

  - name: rank_features_post
    group: rank_post
    template: rank_features
    enabled: false
    meta: {heavy_step: false}
    overrides:
      force_global_only: true

  - name: scaler
    group: scaler
    template: scaler
    enabled: true
    meta: {heavy_step: false, heavy_variants: ["quantile_normal","quantile_uniform"]}

  - name: dimensionality_reducer
    group: dimensionality_reducer
    template: dimensionality_reducer
    enabled: false
    meta: {heavy_step: true, timeout_sec: 300}

  - name: clustering_features
    group: clustering_features
    template: clustering_features
    enabled: false
    meta: {heavy_step: true, timeout_sec: 300}

  - name: drift_detector
    group: drift
    template: drift_detector
    enabled: false
    meta: {heavy_step: false}

  - name: feature_selector
    group: feature_selector
    template: feature_selector
    enabled: false
    meta: {heavy_step: false, heavy_variants: ["mi","model_importance"]}

  - name: imbalance_handler
    group: imbalance
    template: imbalance_handler
    enabled: false
    meta: {heavy_step: false}

  - name: adversarial_validation
    group: adversarial_validation_fixed
    template: adversarial_validation
    enabled: false
    meta: {heavy_step: true, timeout_sec: 300}

evaluation:
  model: autogluon_thin_fast
  seed: 42
