# CatBoost Full Strategy + Cleanup + RFE (GAP variant)
# 1:1 copy of catboost-full-clean-rfe, renamed for gap experiments.
#
# Pipeline:
# 1. Load external diabetes dataset
# 2. Apply statistical + AI binning
# 3. Map original dataset statistics (mean/count)
# 4. Apply tail weighting
# 5. Remove perfect constants (variance ≈ 0)
# 6. Remove correlated features (pearson > 0.95)
# 7. RFE feature selection with LightGBM (predictive power)
#
# Expected: ~127 → ~96 (constants) → ~70 (correlated) → 50-70 (RFE)

chain:
  - external-diabetes-gap
  - diabetes-binning-gap
  - diabetes-orig-stats-gap
  - diabetes-tail-weights-gap
  - cleanup-no-variance-gap   # Remove ONLY perfect constants (variance=0)
  - remove-correlated-gap     # Remove inter-feature correlation (pearson>0.95)
  - rfe-lgbm-gap              # Select features by predictive power
