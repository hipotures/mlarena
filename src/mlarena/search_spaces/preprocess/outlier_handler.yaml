group: outlier
template: outlier_handler

base_config:
  include_cols: null
  exclude_cols: []
  random_state: 42

variants:
  - name: iqr
    params:
      outlier_method: {type: choice, values: [iqr]}
      iqr_factor: {type: float_range, min: 1.0, max: 3.0, step: 0.1, round: 2}
      action: {type: choice, values: [clip]}
  - name: zscore
    params:
      outlier_method: {type: choice, values: [zscore]}
      zscore_threshold: {type: float_range, min: 2.0, max: 4.0, step: 0.1, round: 2}
      action: {type: choice, values: [clip]}
  - name: quantile
    params:
      outlier_method: {type: choice, values: [quantile]}
      lower_quantile: {type: float_range, min: 0.01, max: 0.05, step: 0.01, round: 2}
      upper_quantile: {type: float_range, min: 0.95, max: 0.99, step: 0.01, round: 2}
      action: {type: choice, values: [clip]}
  - name: isolation_forest
    params:
      outlier_method: {type: choice, values: [isolation_forest]}
      isoforest_contamination: {type: float_range, min: 0.01, max: 0.1, step: 0.01, round: 2}
      action: {type: choice, values: [flag_only]}