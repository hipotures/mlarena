# CatBoost Model Template
# Based on: S5E12 Single CatBoost notebook (v3)
#
# Features:
# - CatBoost-only training (no ensemble)
# - Uses binned categorical features
# - Loads sample weights from preprocessing
# - Merges with external dataset (orig_df)
# - Tuned hyperparameters for diabetes prediction
#
# Usage:
#   uv run python scripts/mla.py -p playground-series-s5e12 \
#     --preprocess catboost-full --model catboost-binned

model: autogluon_baseline

config:
  # Model selection
  preset: medium_quality
  time_limit: 600  # 10 minutes
  use_gpu: false
  included_model_types:
    - CAT  # CatBoost only

  # CatBoost hyperparameters (tuned from notebook)
  CAT:
    learning_rate: 0.089
    depth: 6
    l2_leaf_reg: 15.7
    bagging_temperature: 0.898
    random_strength: 0.0006
    iterations: 2000
    early_stopping_rounds: 50

  # Sample weights configuration
  # Weights are automatically loaded from artifacts if available
  # (generated by diabetes_weights preprocessor)
  sample_weight_strategy: null  # Use artifacts (default)
  weight_evaluation: true  # Use weights for evaluation metrics
