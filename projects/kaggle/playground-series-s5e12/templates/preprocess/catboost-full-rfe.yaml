# CatBoost Full Strategy + RFE Feature Selection
# Based on: catboost-full + RFE with LightGBM
#
# Pipeline:
# 1. Load external diabetes dataset
# 2. Apply statistical + AI binning
# 3. Map original dataset statistics (mean/count)
# 4. Apply tail weighting
# 5. RFE feature selection with LightGBM (GPU)
#
# Usage:
#   uv run python scripts/mla.py -p playground-series-s5e12 \
#     preprocess_template=catboost-full-rfe \
#     model_template=catboost-binned-hpo

chain:
  - external-diabetes
  - diabetes-binning
  - diabetes-orig-stats
  - diabetes-tail-weights
  - rfe-lgbm  # New: RFE feature selection
