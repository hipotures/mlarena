project: <slug>
experiment_prefix: mla_preprocess
filter_by_eda: true
tune:
  allow_heavy_steps: true
  allow_heavy_variants: true
  workers: 4
  storage_timeout: 100
  model_cleanup: true
  direction: maximize
  max_trial_sec: 3600
  max_features_out: 5000
  quiet_preprocess_panel: false
  quiet_model_panel: false
  model_verbosity: 2
preprocessors:
- name: sanity_check
  group: sanity
  template: sanity_check
  enabled: true
  meta:
    heavy_step: false
    default_enabled_fast: true
    fixed: true
- name: train_fraction
  group: train_fraction_fixed
  template: train_fraction
  enabled: true
  meta:
    heavy_step: false
    default_enabled_fast: true
    fixed: true
  fixed_config:
    train_fraction: 0.6
    valid_fraction: 0.1
    eval_fraction: 0.1
    random_state: 42
- name: target_transformer
  group: target_transformer_fixed
  template: target_transformer
  enabled: false
  meta:
    heavy_step: false
    fixed: true # DISABLED due to data leakage risk
  fixed_config:
    target_transform: none
    clip_lower_quantile: null
    clip_upper_quantile: null
    shift_before_log: true
    shift_value: null
    standardize: true
- name: datetime_handler
  group: datetime
  template: datetime_handler
  enabled: false
  meta:
    heavy_step: false
- name: time_series_features
  group: time_series_features
  template: time_series_features
  enabled: false
  meta:
    heavy_step: true
    default_enabled_fast: false
    timeout_sec: 600
- name: missingness_features
  group: missingness_features
  template: missingness_features
  enabled: true
  meta:
    heavy_step: false
- name: imputer
  group: imputer
  template: imputer
  enabled: true
  meta:
    heavy_step: false
    heavy_variants: []
    # - knn
    # - iterative
    #fixed: true
- name: rare_category_handler
  group: rare_category
  template: rare_category_handler
  enabled: true
  meta:
    heavy_step: false
- name: feature_group_agg
  group: feature_group_agg
  template: feature_group_agg
  enabled: true
  meta:
    heavy_step: false
- name: groupwise_normalizer
  group: groupwise_normalizer
  template: groupwise_normalizer
  enabled: false
  meta:
    heavy_step: false
- name: categorical_cross
  group: categorical_cross
  template: categorical_cross
  enabled: true
  meta:
    heavy_step: true
    timeout_sec: 300
- name: rank_features_pre
  group: rank_pre
  template: rank_features
  enabled: true
  meta:
    heavy_step: false
  overrides:
    allow_group_mode: true
- name: numeric_binner
  group: numeric_binner
  template: numeric_binner
  enabled: true
  meta:
    heavy_step: false
    heavy_variants: []
    # - kmeans
- name: categorical_encoder
  group: encoding
  template: categorical_encoder
  enabled: true
  meta:
    heavy_step: false
- name: encoder
  group: encoding
  template: encoder
  enabled: true
  meta:
    heavy_step: false
    heavy_variants:
    - target_mean_oof
- name: outlier_handler
  group: outlier
  template: outlier_handler
  enabled: true
  meta:
    heavy_step: false
    heavy_variants: []
    # - isolation_forest    
- name: row_aggregates
  group: row_aggregates
  template: row_aggregates
  enabled: true
  meta:
    heavy_step: false
- name: scaler
  group: scaler
  template: scaler
  enabled: true
  meta:
    heavy_step: false
    heavy_variants: []
    # - quantile_normal
    # - quantile_uniform
- name: feature_interactions
  group: feature_interactions
  template: feature_interactions
  enabled: true
  meta:
    heavy_step: false
- name: feature_polynomial
  group: feature_polynomial
  template: feature_polynomial
  enabled: true
  meta:
    heavy_step: true
    timeout_sec: 600
- name: rank_features_post
  group: rank_post
  template: rank_features
  enabled: true
  meta:
    heavy_step: false
  overrides:
    force_global_only: true
- name: dimensionality_reducer
  group: dimensionality_reducer
  template: dimensionality_reducer
  enabled: false
  meta:
    heavy_step: true
    timeout_sec: 300
- name: clustering_features
  group: clustering_features
  template: clustering_features
  enabled: true
  meta:
    heavy_step: true
    timeout_sec: 300
- name: drift_detector
  group: drift
  template: drift_detector
  enabled: true
  meta:
    heavy_step: false
- name: feature_selector
  group: feature_selector
  template: feature_selector
  enabled: true
  meta:
    heavy_step: false
    fixed: false
  fixed_config:
    selection_method: mi
    n_features: 0.5
    max_drop_fraction: 0.5
    protect_cb_features: true
- name: imbalance_handler
  group: imbalance
  template: imbalance_handler
  enabled: true
  meta:
    heavy_step: false
evaluation:
  # model: autogluon_thin_fast
  model: thin_fast_xgb
  seed: 42

mcts:
  study_name: s6e1_008_xgb_gpu
  direction: maximize
  budget: 10000
  storage_url: sqlite:///experiments/db/mcts.db
  debug: true
  model_verbosity: 0
  model_cleanup: true
  cleanup_processed: false
  selection_policy: puct
  exploration_weight: 1.0
  expansion_width: 0.75
  expansion_alpha: 0.35
  param_expansion_max_samples: 4
  param_expansion_alpha: 0.35
  param_expansion_width: 1.0
  max_depth: 7
  lookahead: 3
  seed: 42

  penalties:
    features_lambda: 0.01
    time_lambda: 0.0

  oracle:
    enabled: true
    model_path: default
    dry_run: true
    pruning_threshold: 0.20
    use_prior_in_puct: true
