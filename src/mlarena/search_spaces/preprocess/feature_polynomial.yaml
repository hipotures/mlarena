group: feature_polynomial
template: feature_polynomial

base_config:
  poly_columns: null
  use_original_features_only: true
  poly_include_bias: false  # Whether to include bias column (constant 1.0)

variants:
  - name: degree_2
    params:
      poly_degree: {type: fixed, value: 2}
      poly_interaction_only: {type: bool}
      max_generated_features: {type: int_range, min: 10, max: 50, step: 5}
    requires_preproc: [{group: imputer}]
  - name: degree_3
    params:
      poly_degree: {type: fixed, value: 3}
      poly_interaction_only: {type: fixed, value: true}
      max_generated_features: {type: int_range, min: 10, max: 50, step: 5}
    requires_preproc: [{group: imputer}]
