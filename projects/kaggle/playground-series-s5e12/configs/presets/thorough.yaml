# Thorough preset - Comprehensive hyperparameter search
# Use for: Serious tuning, competition submissions
# Time: ~2 hours

optuna:
  n_trials: 100
  timeout: 7200  # 2 hours
  cv_folds: 5
  early_stopping_rounds: 50
  sampler: TPESampler
  pruner: MedianPruner

  param_space:
    xgboost:
      learning_rate: [0.001, 0.3, log]
      max_depth: [3, 10, int]
      min_child_weight: [1, 10, int]
      subsample: [0.5, 1.0, float]
      colsample_bytree: [0.5, 1.0, float]
      gamma: [0.0, 5.0, float]
      reg_alpha: [1e-8, 100.0, log]
      reg_lambda: [1e-8, 100.0, log]

    lightgbm:
      learning_rate: [0.001, 0.3, log]
      num_leaves: [15, 255, int]
      min_data_in_leaf: [5, 100, int]
      feature_fraction: [0.5, 1.0, float]
      bagging_fraction: [0.5, 1.0, float]
      bagging_freq: [1, 10, int]
      lambda_l1: [1e-8, 100.0, log]
      lambda_l2: [1e-8, 100.0, log]

    catboost:
      learning_rate: [0.001, 0.3, log]
      depth: [4, 10, int]
      l2_leaf_reg: [1.0, 10.0, float]
      border_count: [32, 255, int]
      bagging_temperature: [0.0, 1.0, float]

preprocessing:
  feat_stage:
    enabled: true
    transformers:
      - LogTransformer
      - StandardScalerTransformer
  cv_stage:
    enabled: true
    transformers:
      - TargetEncodingTransformer
      - FrequencyEncodingTransformer
