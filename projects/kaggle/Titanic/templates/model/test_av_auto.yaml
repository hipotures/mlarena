# Wariant 3: AutoGluon auto_weight strategy
# Automatic balancing (experimental)
# Recommended: weight_evaluation=false per AutoGluon docs

model: autogluon_baseline
preprocess_template: av_weights  # Still runs AV, but weights are NOT used
config:
  preset: medium
  time_limit: 180  # 3 minutes
  use_gpu: false
  included_model_types: ["GBM", "XGB", "CAT"]

  # AutoGluon auto_weight strategy (ignores preprocessing weights)
  sample_weight_strategy: "auto_weight"
  weight_evaluation: false  # Recommended by AutoGluon for auto_weight
