group: feature_interactions
template: feature_interactions

base_config:
  numeric_pairs: []
  auto_pair_numeric: true
  max_auto_pairs: 30

variants:
  - name: arithmetic
    requires_preproc:
      - {group: imputer, step: after}
    params:
      auto_pair_numeric: {type: fixed, value: true}
      interaction_types:
        type: subset
        values: [add, sub, mul, div]
        min_items: 1
        max_items: 2
        sort: true
      max_generated_features: {type: int_range, min: 50, max: 200, step: 25}
