# Test template: HPO Best preset for Titanic
# Usage: uv run python scripts/mla.py -p Titanic --model-template test_hpo_best

model: autogluon_baseline
hpo_preset: hpo_boost_best
config:
  preset: best
  time_limit: 14400
  use_gpu: false
  included_model_types: [GBM, XGB, CAT]

  # Optional: Override preset defaults
  # num_trials: 300  # Override best default (200)
