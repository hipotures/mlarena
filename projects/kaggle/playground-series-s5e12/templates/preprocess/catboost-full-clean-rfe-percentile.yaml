# CatBoost Full Strategy + Cleanup + RFE (percentile weights)
# Complete pipeline with feature cleaning before RFE
#
# Pipeline:
# 1. Load external diabetes dataset
# 2. Apply statistical + AI binning
# 3. Map original dataset statistics (mean/count)
# 4. Apply tail weighting (percentile)
# 5. Remove perfect constants (variance ~ 0)
#
# Usage:
#   uv run python scripts/mla.py -p playground-series-s5e12 \
#     preprocess_template=catboost-full-clean-rfe-percentile \
#     model_template=catboost-binned-hpo \
#     common.use_gpu=true

chain:
  - external-diabetes
  - diabetes-binning
  - diabetes-orig-stats
  - diabetes-tail-weights-percentile
  - cleanup-no-variance
