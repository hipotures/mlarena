# Full Binning Strategy Preprocessing Chain
# Based on: S5E12 Single CatBoost notebook (v3)
# Compatible with: CatBoost, LightGBM, XGBoost, any boosting model
#
# Pipeline:
# 1. Load external diabetes dataset (external-diabetes)
# 2. Apply statistical + AI binning (diabetes-binning)
# 3. Map original dataset statistics (diabetes-orig-stats)
# 4. Apply tail weighting (diabetes-tail-weights)
#
# Usage:
#   uv run python scripts/mla.py -p playground-series-s5e12 \
#     preprocess_template=binned-full \
#     model_template=<any-model>

chain:
  - external-diabetes
  - diabetes-binning
  - diabetes-orig-stats
  - diabetes-tail-weights
