preprocessing:
  storage_format: parquet
  compression: snappy
  save_transformed_data: true

  feat_stage:
    enabled: true
    transformers:
      # Numeric scaling (safe, no target dependency)
      - type: StandardScalerTransformer
        columns:
          - annual_income
          - debt_to_income_ratio
          - credit_score
          - loan_amount
          - interest_rate

      # Frequency encoding (ADDITIONAL feature, originals preserved)
      # Creates *_freq columns with category frequency
      # XGBoost will use BOTH original categories AND frequency features
      - type: FrequencyEncodingTransformer
        columns:
          - gender
          - marital_status
          - education_level
          - employment_status
          - loan_purpose
          - grade_subgrade
        normalize: true

  cv_stage:
    enabled: false  # Disabled - use in CVObjective instead
    transformers: []
