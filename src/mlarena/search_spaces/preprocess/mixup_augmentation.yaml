group: mixup_augmentation
template: mixup_augmentation

base_config:
  include_cols: null
  exclude_cols: []
  use_original_features_only: true
  augment_ratio: 0.3
  alpha: 0.2
  lambda_clip: null
  allow_soft_labels: false
  hard_label_threshold: 0.5
  random_state: 42

variants:
  - name: hard_small
    params:
      alpha: {type: float_range, min: 0.1, max: 0.4, step: 0.1}
      allow_soft_labels: {type: fixed, value: false}
      augment_ratio: {type: float_range, min: 0.1, max: 0.4, step: 0.1}
  - name: hard_large
    params:
      alpha: {type: float_range, min: 0.6, max: 1.2, step: 0.2}
      allow_soft_labels: {type: fixed, value: false}
      augment_ratio: {type: float_range, min: 0.2, max: 0.6, step: 0.1}
  - name: soft
    params:
      alpha: {type: float_range, min: 0.1, max: 0.6, step: 0.1}
      allow_soft_labels: {type: fixed, value: true}
      augment_ratio: {type: float_range, min: 0.1, max: 0.4, step: 0.1}
