group: dimensionality_reducer
template: dimensionality_reducer

base_config:
  method: pca
  n_components: 20
  include_sparse: false
  random_state: 42
  whiten: false

variants:
  - name: pca_numeric
    weight: 2.0
    params:
      method: {type: choice, values: [pca]}
      n_components: {type: int_range, min: 5, max: 100, step: 5}
      whiten: {type: bool}
    requires_preproc: [{group: imputer}, {group: scaler}]
  - name: svd_sparse
    params:
      method: {type: choice, values: [svd]}
      n_components: {type: int_range, min: 10, max: 300, step: 10}
      include_sparse: {type: fixed, value: true}
    requires_preproc: [{group: imputer}, {group: encoding}]
