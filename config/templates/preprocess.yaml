templates:
  baseline:
    module: null  # No custom module - just drop IGNORED_COLUMNS
    config: {}
    cache: true

  # Meta-template: full preprocessing pipeline
  full-pipeline:
    chain: [missing_impute, feature_select]

  # Individual preprocessing steps
  missing_impute:
    module: missing_values_imputer
    cache: true
    config:
      numeric_strategy: median
      categorical_strategy: most_frequent

  feature_select:
    module: feature_selector
    cache: true
    config:
      method: variance_threshold
      threshold: 0.01

  feature_select_kbest:
    module: feature_selector
    cache: true
    config:
      method: select_k_best
      k: 8
      score_func: f_classif

  # Native categorical handling for boost algorithms
  categorical_boost:
    module: categorical_encoder
    cache: true
    config:
      max_cardinality: 50
      exclude_text_type: false
      include_numeric_categories: true
      enable_auto_detect: true
      auto_detect_threshold: 25

  # Auto-detect only (no EDA dependency)
  categorical_auto:
    module: categorical_encoder
    cache: true
    config:
      max_cardinality: 50
      exclude_text_type: false
      include_numeric_categories: false  # Skip EDA numeric detection
      enable_auto_detect: true
      auto_detect_threshold: 25

  # ============================================
  # UNIVERSAL SUB-MODULES (Stage 0 - Infrastructure Ready)
  # ============================================

  # 0. No-op (Smoke Test)
  noop:
    module: noop
    cache: false
    config: {}

  # 1. Sanity Check / Types / Basic Cleaning
  sanity_check:
    module: sanity_check
    cache: true
    config:
      min_unique_fraction: 0.01
      max_missing_fraction: 0.95
      drop_duplicates: true
      column_types_override: {}
      ignore_columns: []

  # 2. Missing Value Imputation
  imputer:
    module: imputer
    cache: true
    config:
      numeric_strategy: "mean"
      categorical_strategy: "most_frequent"
      column_strategies: {}
      fill_value: 0
      knn_n_neighbors: 5
      iterative_estimator: "bayesian_ridge"
      iterative_max_iter: 10
      treat_outliers_as_na: false
      outlier_method: "iqr"
      outlier_threshold: null

  # 2a. Median imputation (robust to outliers)
  imputer_median:
    module: imputer
    cache: true
    config:
      numeric_strategy: "median"
      categorical_strategy: "most_frequent"

  # 2b. KNN imputation (uses feature correlations)
  imputer_knn:
    module: imputer
    cache: true
    config:
      numeric_strategy: "knn"
      categorical_strategy: "most_frequent"
      knn_n_neighbors: 5

  # 2c. Iterative imputation (MICE algorithm)
  imputer_iterative:
    module: imputer
    cache: true
    config:
      numeric_strategy: "iterative"
      categorical_strategy: "most_frequent"
      iterative_max_iter: 10

  # 2d. Outlier-robust imputation
  imputer_outlier_robust:
    module: imputer
    cache: true
    config:
      numeric_strategy: "median"
      categorical_strategy: "most_frequent"
      treat_outliers_as_na: true
      outlier_method: "iqr"
      outlier_threshold: 1.5

  # 3. Rare and High-Cardinality Categories
  rare_category_handler:
    module: rare_category_handler
    cache: true
    config:
      min_freq: 10
      min_freq_ratio: 0.01
      top_k: null
      rare_label: "__RARE__"
      detect_id_like_columns: true
      id_unique_fraction_threshold: 0.95

  # 4. Categorical Encoding
  encoder:
    module: encoder
    cache: true
    config:
      encoding_method: "one_hot"  # none|one_hot|ordinal|target_mean|catboost|hashing
      max_cardinality: 50  # Auto-exclude columns with >50 unique values (prevents explosion)
      drop_first: false
      handle_unknown: "ignore"

  # 5. Scaling and Numerical Transformations
  scaler:
    module: scaler
    cache: true
    config:
      scaling_method: "standard"  # none|standard|minmax|robust|quantile_normal|quantile_uniform
      numeric_include: null  # null = all numeric columns
      numeric_exclude: []
      log_transform: []
      clip_lower_quantile: null
      clip_upper_quantile: null
      n_quantiles: 1000
      random_state: 42

  # Scaler variants for testing
  scaler_robust:
    module: scaler
    cache: true
    config:
      scaling_method: "robust"
      clip_lower_quantile: 0.01
      clip_upper_quantile: 0.99

  scaler_minmax:
    module: scaler
    cache: true
    config:
      scaling_method: "minmax"

  scaler_none:
    module: scaler
    cache: true
    config:
      scaling_method: "none"  # Pass-through (for tree-based models)

  # 6. Feature Selection
  feature_selector:
    module: feature_selector
    cache: true
    config:
      selection_method: "variance"  # variance|mi|correlation|model_importance|l1|rfe|none
      k_features: null
      keep_fraction: 0.8
      min_variance: 0.01

  # 7. Drift Detection / Train-Test Differences
  drift_detector:
    module: drift_detector
    cache: true
    config:
      drift_metric: "psi"  # psi|ks|chi2|model_auc
      max_psi: 0.25
      action: "flag_only"  # none|drop|flag_only
      max_drop_fraction: 0.2

  # 8. Feature Engineering (Interactions & Aggregations)
  feature_engineer:
    module: feature_engineer
    cache: true
    config:
      interaction_types: ["add", "mul"]
      numeric_pairs: []
      poly_degree: 2
      group_keys: []
      group_value_cols: []
      aggs: ["mean", "std"]
      max_generated_features: 200

  # 9. Target Transformation (Regression)
  target_transformer:
    module: target_transformer
    cache: true
    config:
      target_transform: "none"  # none|log1p|boxcox|yeo_johnson
      clip_lower_quantile: null
      clip_upper_quantile: null
      shift_before_log: true
      shift_value: null
      standardize: true

  # 10. Class Imbalance Handling
  imbalance_handler:
    module: imbalance_handler
    cache: true
    config:
      imbalance_method: "class_weight"  # none|class_weight|random_over|random_under|smote|smotenc|adasyn
      sampling_strategy: "auto"
      use_sample_weights: true
      random_state: 42

  # 11. Outlier Handling
  outlier_handler:
    module: outlier_handler
    cache: true
    config:
      outlier_method: "iqr"  # none|quantile|iqr|zscore|isolation_forest
      iqr_factor: 1.5
      action: "clip"  # clip|set_na|flag_only

  # 12. AutoGluon Booster
  autogluon_booster:
    module: autogluon_booster
    cache: true
    config:
      autogluon_mode: "raw_categories"  # raw_categories|boosted_categories
      freq_encoding_cols: []
      auto_text_detection: true
      enforce_dtypes: true

  # ============================================
  # META-TEMPLATES (Chains) - Universal Sub-Modules
  # ============================================

  # Smoke test chain
  noop_chain:
    chain: [noop, noop]

  # Test imputer chain
  test_imputer_chain:
    chain: [noop, imputer]

  # Test chain with rare_category_handler
  rare_test_chain:
    chain: [noop, rare_category_handler, noop]

  # Test scaler chain
  scaler_test_chain:
    chain: [imputer, scaler_robust]

  minimal_pipeline:
    chain: [sanity_check, imputer, autogluon_booster]

  standard_pipeline:
    chain: [sanity_check, imputer, rare_category_handler, encoder, scaler, feature_selector]

  full_universal_pipeline:
    chain: [
      sanity_check,
      imputer,
      outlier_handler,
      rare_category_handler,
      encoder,
      scaler,
      drift_detector,
      feature_selector,
      autogluon_booster
    ]
