# CatBoost Full Strategy + Cleanup + RFE (XGBoost)
# Same as catboost-full-clean-rfe but uses XGBoost for RFE
#
# Usage:
#   uv run python scripts/mla.py -p playground-series-s5e12 \
#     preprocess_template=catboost-full-clean-rfe-xgb \
#     model_template=catboost-binned-hpo \
#     common.use_gpu=true

chain:
  - external-diabetes
  - diabetes-binning
  - diabetes-orig-stats
  - diabetes-tail-weights
  - cleanup-variance
  - remove-correlated  # Inter-feature correlation
  - rfe-xgb  # RFE with XGBoost
