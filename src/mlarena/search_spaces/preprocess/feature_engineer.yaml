group: feature_engineer
template: feature_engineer

base_config:
  numeric_pairs: []
  group_keys: []
  group_value_cols: []
  aggs: []

variants:
  - name: interactions
    params:
      interaction_types:
        type: subset
        values: [add, sub, mul, div]
        min_items: 1
        max_items: 2
        sort: true
      poly_degree: {type: fixed, value: null}
      max_generated_features: {type: int_range, min: 50, max: 200, step: 25}
  - name: polynomial
    params:
      interaction_types: {type: fixed, value: []}
      poly_degree: {type: int_range, min: 2, max: 3}
      max_generated_features: {type: int_range, min: 50, max: 200, step: 25}
    requires_preproc: [{group: imputer}]
  - name: mixed
    params:
      interaction_types:
        type: subset
        values: [add, mul]
        min_items: 1
        max_items: 2
        sort: true
      poly_degree: {type: int_range, min: 2, max: 3}
      max_generated_features: {type: int_range, min: 50, max: 200, step: 25}
    requires_preproc: [{group: imputer}]
