# Test RFE with LightGBM on Titanic
# Quick test to verify RFE functionality
module: feature_selector
cache: true
config:
  selection_method: rfe
  importance_model_type: lgbm
  n_features_to_select: 5  # Keep top 5 features (Titanic has ~10 features)
  n_estimators: 50  # Fast test
  max_depth: 4
  use_gpu: false  # CPU for Titanic test
  random_state: 42
