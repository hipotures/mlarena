model: autogluon_baseline
preprocess_template: advanced-chain

config:
  preset: best_quality
  time_limit: 28800
  use_gpu: true
  included_model_types:
    - GBM
    - XGB

  hyperparameters:
    hyperparameter_tune_kwargs:
      num_trials: 500
      scheduler: local
      searcher: auto

    search_space:
      # LightGBM
      GBM:
        device: gpu
        gpu_use_dp: false
        learning_rate: [0.01, 0.3, log]
        num_leaves: [20, 150, int]
        min_data_in_leaf: [10, 50, int]
        feature_fraction: [0.6, 1.0]
        bagging_fraction: [0.6, 1.0]
        bagging_freq: [1, 7, int]
        lambda_l1: [1e-5, 10.0, log]
        lambda_l2: [1e-5, 10.0, log]
        num_boost_round: [500, 3000, int]

      # XGBoost
      XGB:
        device: cuda:0
        tree_method: hist
        learning_rate: [0.01, 0.3, log]
        max_depth: [3, 8, int]
        min_child_weight: [1, 7, int]
        subsample: [0.6, 1.0]
        colsample_bytree: [0.6, 1.0]
        gamma: [0.0, 2.0]
        reg_alpha: [1e-5, 10.0, log]
        reg_lambda: [1e-5, 10.0, log]
        n_estimators: [500, 3000, int]
